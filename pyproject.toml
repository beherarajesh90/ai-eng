[project]
name = "ai-eng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajesh", email = "beherarajesh90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.1",
    "dotenv>=0.9.9",
    "fastembed>=0.9.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.26.0",
    "pip>=26.2.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "unstructured>=0.27.27",
]

[project.scripts]
ai-eng = "ai_eng:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
